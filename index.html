<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Watermark Generator</title>
    <!-- Import Abhaya Libre font -->
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #232326;
            --sidebar-bg: #1A1A1A;
            --text-color: #e8eaed;
            --accent-color: #3b82f6;
            --card-bg: #121212;
            --border-color: #939497;
            color-scheme: dark;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
        }

        h1 { margin-top: 0; font-size: 1.5rem; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #B5B5B5;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #252525;
            color: #e5e7eb;
            color-scheme: dark;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .action-bar {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 1rem;
        }

        button.primary-btn:hover { background-color: #1d4ed8; }

        .preview-area {
            border: 2px dashed var(--border-color);
            padding: 20px;
            background: #252525;
            text-align: center;
            overflow: hidden;
            border-radius: 8px;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr !important;
                gap: 15px;
            }
            .form-grid > div[style*="grid-column: span 2"] {
                grid-column: span 1 !important;
            }
            .settings-row {
                flex-direction: column;
            }
            .settings-row > input {
                width: 100% !important;
            }
        }
        
        /* GitHub Icon Styling */
        .github-link {
            position: absolute;
            top: 25px;
            right: 25px;
            color: #9ca3af; /* 預設淡灰色，唔會太搶眼 */
            transition: color 0.2s ease;
        }
        
        .github-link:hover {
            color: var(--accent-color, #2563eb); /* 滑鼠游標移過去會變藍色 */
        }
        
        .github-link svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }
        
        /* 防撞設計：確保標題唔會掂到個 Icon */
        h1 {
            padding-right: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <a href="https://github.com/sparktsang/watermark" target="_blank" class="github-link" title="View source on GitHub">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
            </a>
            <h1>Image Watermark Generator</h1>
            <p style="color:#A3A3A3; font-size:0.95rem; margin-bottom: 25px;">
                Add a text watermark to your images entirely in your browser. No server uploads, 100% private.
            </p>

            <!-- Controls -->
            <div class="form-grid">
                <div style="grid-column: span 2;">
                    <label>1. Upload Image:</label>
                    <input type="file" id="wmImageUpload" accept="image/png, image/jpeg, image/webp">
                </div>

                <div style="grid-column: span 2;">
                    <label>2. Watermark Text:</label>
                    <!-- EDIT VALUE HERE TO CHANGE DEFAULT TEXT -->
                    <input type="text" id="wmText" value="sparktsang.github.io">
                </div>

                <div>
                    <label>Font Family:</label>
                    <select id="wmFont">
                        <option value="'Abhaya Libre', serif" selected>Abhaya Libre</option>
                        <option value="Arial">Arial</option>
                        <option value="'Times New Roman', Times, serif">Times New Roman</option>
                        <option value="'Courier New', Courier, monospace">Courier New</option>
                    </select>
                </div>

                <div>
                    <label>Color:</label>
                    <!-- EDIT VALUE HERE TO CHANGE DEFAULT COLOR -->
                    <input type="color" id="wmColor" value="#ffffff" style="height: 42px; padding: 2px;">
                </div>

                <div>
                    <label>Position:</label>
                    <select id="wmPosition">
                        <option value="bottom-right">Bottom-Right</option>
                        <option value="bottom-left" selected>Bottom-Left</option>
                        <option value="top-right">Top-Right</option>
                        <option value="top-left">Top-Left</option>
                    </select>
                </div>

                <div>
                    <label>Settings (Size pt | Margin X | Margin Y):</label>
                    <div class="settings-row" style="display: flex; gap: 10px;">
                        <!-- EDIT VALUES HERE TO CHANGE DEFAULT SIZE AND MARGINS -->
                        <input type="number" id="wmSize" value="18" step="1" title="Absolute Font Size (pt)" style="width: 33%;">
                        <input type="number" id="wmMarginX" value="20" step="1" title="Margin X (Left/Right px)" style="width: 33%;">
                        <input type="number" id="wmMarginY" value="6" step="1" title="Margin Y (Top/Bottom px)" style="width: 33%;">
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button class="primary-btn" onclick="downloadWatermark()">Download Watermarked Image</button>
            </div>

            <label>Live Preview:</label>
            <div class="preview-area">
                <canvas id="wmCanvas" style="max-width: 100%; height: auto; display: none;"></canvas>
                <p id="wmPlaceholder" style="color: #999; margin: 50px 0;">Upload an image to see preview.</p>
            </div>
        </div>
    </div>

    <script>
        let wmImageObj = null;

        // Event Listeners for auto-update
        document.getElementById('wmImageUpload').addEventListener('change', handleImageUpload);
        const wmInputs = ['wmText', 'wmFont', 'wmColor', 'wmPosition', 'wmSize', 'wmMarginX', 'wmMarginY'];
        wmInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', drawWatermark);
            document.getElementById(id).addEventListener('change', drawWatermark);
        });

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    wmImageObj = img;
                    document.getElementById('wmPlaceholder').style.display = 'none';
                    document.getElementById('wmCanvas').style.display = 'inline-block';
                    
                    // Wait slightly for Abhaya Libre font to be ready
                    document.fonts.ready.then(() => {
                        drawWatermark();
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function drawWatermark() {
            if (!wmImageObj) return;

            const canvas = document.getElementById('wmCanvas');
            const ctx = canvas.getContext('2d');

            // Match canvas size to original image
            canvas.width = wmImageObj.width;
            canvas.height = wmImageObj.height;

            // Draw original image
            ctx.drawImage(wmImageObj, 0, 0);

            // Get Settings
            const text = document.getElementById('wmText').value;
            const font = document.getElementById('wmFont').value;
            const color = document.getElementById('wmColor').value;
            const pos = document.getElementById('wmPosition').value;
            
            // Use absolute font size and margins
            const fontSize = parseFloat(document.getElementById('wmSize').value) || 24; // Default to 24pt
            const marginX = parseInt(document.getElementById('wmMarginX').value) || 0;
            const marginY = parseInt(document.getElementById('wmMarginY').value) || 0;

            // Configure text style
            ctx.font = `bold ${fontSize}pt ${font}`;
            ctx.fillStyle = color;
            
            // Add shadow for contrast
            ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
            ctx.shadowBlur = fontSize * 0.3;
            ctx.shadowOffsetX = fontSize * 0.1;
            ctx.shadowOffsetY = fontSize * 0.1;

            // Calculate Coordinates
            let x, y;

            if (pos.includes('right')) {
                ctx.textAlign = 'right';
                x = canvas.width - marginX;
            } else {
                ctx.textAlign = 'left';
                x = marginX;
            }

            if (pos.includes('bottom')) {
                ctx.textBaseline = 'bottom';
                y = canvas.height - marginY;
            } else {
                ctx.textBaseline = 'top';
                y = marginY;
            }

            // Draw Text
            ctx.fillText(text, x, y);
        }

        function downloadWatermark() {
            if (!wmImageObj) {
                alert("Please upload an image first.");
                return;
            }
            
            const canvas = document.getElementById('wmCanvas');
            const link = document.createElement('a');
            
            // Generate filename based on current timestamp
            const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
            link.download = `watermarked_${timestamp}.png`;
            
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
    
    <style>
        .spark-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4); /* 半透明黑底，適應深淺背景 */
            backdrop-filter: blur(4px);      /* 磨砂玻璃效果 */
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 9999; /* 確保浮在最上層 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    
        .spark-badge:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #111; /* Hover 時變白底黑字，高對比 */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
    
        .spark-badge span {
            font-weight: 600;
            margin-left: 4px;
        }
        
        /* Mobile RWD: 防止在手機遮住重要內容 */
        @media (max-width: 600px) {
            .spark-badge {
                bottom: 10px;
                right: 10px;
                padding: 6px 10px;
                font-size: 10px;
            }
        }
    </style>
    
    <a href="https://sparktsang.github.io/artifacts/" target="_blank" class="spark-badge" title="Visit Spark's Website">
        Built by <span>Spark Tsang</span>
    </a>
</body>
</html>
